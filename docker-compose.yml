services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gate}
      POSTGRES_DB: ${POSTGRES_DB:-gate}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # The database is never published to the host in production.
    expose:
      - "5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-gate}:${POSTGRES_PASSWORD:-gate}@db:5432/${POSTGRES_DB:-gate}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      COMPANY_NAME: ${COMPANY_NAME:-Acme Industries}
      STORAGE_DIR: /data/storage
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-admin@company.com}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?set BOOTSTRAP_PASSWORD in .env}
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  db-data:
  storage:
